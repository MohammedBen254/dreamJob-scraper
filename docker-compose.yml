services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dreamjob
      POSTGRES_PASSWORD: dreamjob
      POSTGRES_DB: dreamjob
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreamjob"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  scraper:
    build: .
    command: schedule
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://dreamjob:dreamjob@postgres:5432/dreamjob
      REDIS_URL: redis://redis:6379/0
      SCRAPER_TARGET_URL: https://www.dreamjob.ma
    env_file:
      - .env

  health:
    build: .
    command: health
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://dreamjob:dreamjob@postgres:5432/dreamjob
      REDIS_URL: redis://redis:6379/0

volumes:
  postgres_data:
