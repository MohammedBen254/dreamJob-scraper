services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: dreamjob
      POSTGRES_PASSWORD: dreamjob
      POSTGRES_DB: dreamjob
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dreamjob"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  scraper:
    build: .
    command: schedule
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://dreamjob:dreamjob@postgres:5432/dreamjob
      SCRAPER_TARGET_URL: https://www.dreamjob.ma
      OLLAMA_HOST: http://host.docker.internal:11434
      HF_HOME: /home/app/.cache/huggingface
      FASTEMBED_CACHE_PATH: /home/app/.cache/fastembed
    env_file:
      - .env
    volumes:
      - hf_cache:/home/app/.cache/huggingface
      - fastembed_cache:/home/app/.cache/fastembed

  web:
    build: .
    command: web
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://dreamjob:dreamjob@postgres:5432/dreamjob
      WEB_PORT: 8080
      OLLAMA_HOST: http://host.docker.internal:11434

volumes:
  postgres_data:
  hf_cache:
  fastembed_cache: